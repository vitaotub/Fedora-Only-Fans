<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOF - Modo Avançado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="header-avancado">
            <div class="titulo">
                <img src="icone_app.png" alt="FOF" style="width: 40px; height: 40px; border-radius: 50%; object-fit: contain;" onerror="this.style.display='none'">
                <h1>Modo Avançado</h1>
                <span class="badge-modo">⚡ Todas as Sessões</span>
                <span style="color: var(--text-muted); font-size: 0.8rem;">v<span class="fof-version">0.9.5-alpha</span></span>
            </div>
            <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
                <div class="stats-rapidas">
                    <span>✅ <span class="num concluido" id="stats-executados">0</span></span>
                    <span>⏭️ <span class="num" id="stats-pulados">0</span></span>
                    <span>⏳ <span class="num" id="stats-pendentes">9</span></span>
                </div>
                <button class="btn-reiniciar" onclick="reiniciarProgresso()" style="background-color: #ef4444; color: white; border: none; border-radius: 6px; padding: 0.4rem 1rem; cursor: pointer;">
                    🔄 Reiniciar Progresso
                </button>
                <a href="index.html" class="voltar">← Voltar ao início</a>
            </div>
        </div>

        <!-- ===== PROGRESSO GERAL ===== -->
        <div class="progress-geral-avancado">
            <div class="info">
                <span>📊 Progresso:</span>
                <span class="count" id="progress-count">0/9</span>
                <span id="progress-percent-label">0%</span>
            </div>
            <div class="barra">
                <div class="fill" id="progress-geral-fill-avancado"></div>
            </div>
        </div>

        <!-- ===== CONTAINER DAS SESSÕES ===== -->
        <div id="sessoes-container">
            <div class="loading-sessao">
                <div class="spinner"></div>
                <p>Carregando todas as sessões...</p>
            </div>
        </div>

        <!-- ===== BOTÃO VOLTAR AO TOPO ===== -->
        <button class="btn-topo" id="btn-topo" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</button>
    </div>

    <script src="script.js"></script>
    <script>
        // ============================================================
        // MODO AVANÇADO - CARREGAMENTO DINÂMICO DE SESSÕES
        // ============================================================

        var sessoes = [
            '00-boas-vindas',
            '01-restauracao',
            '02-otimizacao',
            '03-repositorios',
            '04-fontes',
            '05-launchers',
            '06-loja',
            '07-manutencao',
            '08-fof-manutencao'
        ];

        var nomesSessoes = {
            '00-boas-vindas': 'Boas-vindas',
            '01-restauracao': 'Restauração',
            '02-otimizacao': 'Otimização',
            '03-repositorios': 'Repositórios',
            '04-fontes': 'Fontes',
            '05-launchers': 'Launchers',
            '06-loja': 'Loja',
            '07-manutencao': 'Manutenção',
            '08-fof-manutencao': 'Manutenção FOF'
        };

        var sessoesCarregadas = {};

        /**
         * Carrega todas as sessões
         */
        async function carregarTodasSessoes() {
            var container = document.getElementById('sessoes-container');
            if (!container) return;

            // Verifica se o script.js foi carregado
            if (typeof getProgress === 'undefined' || typeof FOF_VERSION === 'undefined') {
                console.warn('⏳ Aguardando script.js carregar...');
                await new Promise(resolve => setTimeout(resolve, 500));
                if (typeof getProgress === 'undefined') {
                    console.error('❌ script.js não foi carregado!');
                    container.innerHTML = `
                        <div class="sessao-container" style="text-align:center; padding: 3rem 1rem; color: #ef4444; border: 1px solid #ef4444;">
                            <h3>❌ Erro: script.js não foi carregado!</h3>
                            <p style="color: var(--text-muted);">Recarregue a página ou verifique se o arquivo existe.</p>
                        </div>
                    `;
                    return;
                }
            }

            console.log('✅ script.js carregado! Versão:', FOF_VERSION);

            container.innerHTML = '';

            for (var i = 0; i < sessoes.length; i++) {
                var nomeSessao = sessoes[i];
                var arquivo = nomeSessao + '.html';

                try {
                    var response = await fetch(arquivo);
                    if (!response.ok) {
                        throw new Error('Erro ao carregar ' + arquivo + ': ' + response.status);
                    }

                    var html = await response.text();
                    var bodyMatch = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
                    var conteudo = bodyMatch ? bodyMatch[1] : html;
                    var scriptMatch = conteudo.match(/<script[^>]*>([\s\S]*?)<\/script>/gi);
                    var conteudoSemScripts = conteudo.replace(/<script[^>]*>([\s\S]*?)<\/script>/gi, '');

                    var wrapper = document.createElement('div');
                    wrapper.className = 'sessao-wrapper';
                    wrapper.id = 'wrapper-' + nomeSessao;
                    wrapper.innerHTML = conteudoSemScripts;

                    container.appendChild(wrapper);

                    if (scriptMatch) {
                        scriptMatch.forEach(function(script) {
                            var scriptContent = script.replace(/<script[^>]*>/, '').replace(/<\/script>/, '');
                            try {
                                var win = window;
                                eval.call(win, scriptContent);
                            } catch (e) {
                                console.error('Erro ao executar script da sessão ' + nomeSessao + ':', e);
                            }
                        });
                    }

                    sessoesCarregadas[nomeSessao] = true;
                    console.log('✅ Sessão carregada: ' + nomeSessao);

                } catch (e) {
                    console.error('Erro ao carregar ' + nomeSessao + ':', e);
                    var errorDiv = document.createElement('div');
                    errorDiv.className = 'sessao-container';
                    errorDiv.style.textAlign = 'center';
                    errorDiv.style.padding = '2rem 1rem';
                    errorDiv.style.color = '#ef4444';
                    errorDiv.style.border = '1px solid #ef4444';
                    errorDiv.style.borderRadius = '8px';
                    errorDiv.innerHTML = `
                        <h3>❌ Erro ao carregar ${nomesSessoes[nomeSessao]}</h3>
                        <p style="color: var(--text-muted);">${e.message}</p>
                    `;
                    container.appendChild(errorDiv);
                }
            }

            atualizarLabelsSessoes();
            var event = new CustomEvent('todas-sessoes-carregadas');
            document.dispatchEvent(event);

            // Recarrega o estado dos botões após carregar todas as sessões
            setTimeout(carregarProgressoInicial, 400);
        }

        function atualizarLabelsSessoes() {
            sessoes.forEach(function(nome) {
                var label = document.querySelector('#wrapper-' + nome + ' .sessao-label');
                if (label) {
                    var status = getStatusComando(nome);
                    label.className = 'sessao-label';
                    if (status === 'executado') label.classList.add('concluida');
                    if (status === 'pulado') label.classList.add('pulada');
                }

                var container = document.querySelector('#wrapper-' + nome + ' .sessao-container');
                if (container) {
                    var status = getStatusComando(nome);
                    container.className = 'sessao-container';
                    if (status === 'executado') container.classList.add('concluida');
                    if (status === 'pulado') container.classList.add('pulada');
                }
            });
        }

        function atualizarStatsAvancado() {
            var progress = getProgressSync();
            var total = sessoes.length;
            var executados = progress.executados.length;
            var pulados = progress.pulados.length;
            var pendentes = total - executados - pulados;

            document.getElementById('stats-executados').textContent = executados;
            document.getElementById('stats-pulados').textContent = pulados;
            document.getElementById('stats-pendentes').textContent = pendentes;

            var percentual = Math.round((executados / total) * 100);
            var fill = document.getElementById('progress-geral-fill-avancado');
            var count = document.getElementById('progress-count');
            var percent = document.getElementById('progress-percent-label');

            if (fill) fill.style.width = percentual + '%';
            if (count) count.textContent = executados + '/' + total;
            if (percent) percent.textContent = percentual + '%';
        }

        // ===== SOBRESCRITAS =====
        var marcarBotaoComoExecutadoOriginalAvancado = marcarBotaoComoExecutado;
        var restaurarBotaoOriginalOriginalAvancado = restaurarBotaoOriginal;
        var marcarComoPuladoOriginalAvancado = marcarComoPulado;
        var desmarcarComoPuladoOriginalAvancado = desmarcarComoPulado;

        marcarBotaoComoExecutado = function(idComando) {
            marcarBotaoComoExecutadoOriginalAvancado(idComando);
            setTimeout(function() {
                atualizarStatsAvancado();
                atualizarLabelsSessoes();
            }, 100);
        };

        restaurarBotaoOriginal = function(idComando) {
            restaurarBotaoOriginalOriginalAvancado(idComando);
            setTimeout(function() {
                atualizarStatsAvancado();
                atualizarLabelsSessoes();
            }, 100);
        };

        marcarComoPulado = function(idComando) {
            marcarComoPuladoOriginalAvancado(idComando);
            setTimeout(function() {
                atualizarStatsAvancado();
                atualizarLabelsSessoes();
            }, 100);
        };

        desmarcarComoPulado = function(idComando) {
            desmarcarComoPuladoOriginalAvancado(idComando);
            setTimeout(function() {
                atualizarStatsAvancado();
                atualizarLabelsSessoes();
            }, 100);
        };

        /**
         * Reinicia o progresso (usa a API do servidor)
         */
        async function reiniciarProgresso() {
            if (!confirm('Tem certeza que deseja reiniciar todo o progresso?\n\nTodas as sessões serão marcadas como pendentes.')) {
                return;
            }

            // Remove do servidor
            try {
                const response = await fetch(API_URL + '/progress', {
                    method: 'DELETE'
                });
                if (response.ok) {
                    console.log('✅ Progresso removido do servidor');
                }
            } catch (e) {
                console.warn('⚠️ Não foi possível remover do servidor');
            }

            // Remove do localStorage
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (e) { /* ignore */ }

            // Limpa cache
            progressCache = { executados: [], pulados: [] };
            progressLoaded = true;

            // Recarrega a página
            location.reload();
        }

        // ===== INICIALIZAÇÃO =====
        document.addEventListener('DOMContentLoaded', function() {
            // Aguarda o script.js carregar antes de carregar as sessões
            if (typeof getProgress !== 'undefined' && typeof FOF_VERSION !== 'undefined') {
                carregarTodasSessoes();
                setTimeout(atualizarStatsAvancado, 500);
            } else {
                console.warn('⏳ Aguardando script.js carregar...');
                setTimeout(function() {
                    if (typeof getProgress !== 'undefined' && typeof FOF_VERSION !== 'undefined') {
                        carregarTodasSessoes();
                        setTimeout(atualizarStatsAvancado, 500);
                    } else {
                        console.error('❌ script.js não carregou corretamente!');
                        document.getElementById('sessoes-container').innerHTML = `
                            <div class="sessao-container" style="text-align:center; padding: 3rem 1rem; color: #ef4444; border: 1px solid #ef4444;">
                                <h3>❌ Erro: script.js não foi carregado!</h3>
                                <p style="color: var(--text-muted);">Recarregue a página ou verifique se o arquivo existe.</p>
                            </div>
                        `;
                    }
                }, 200);
            }

            document.querySelectorAll('.fof-version').forEach(function(el) {
                el.textContent = FOF_VERSION || '0.9.5-alpha';
            });

            var btnTopo = document.getElementById('btn-topo');
            window.addEventListener('scroll', function() {
                if (window.scrollY > 400) {
                    btnTopo.classList.add('visivel');
                } else {
                    btnTopo.classList.remove('visivel');
                }
            });

            console.log('🚀 Modo Avançado v' + (FOF_VERSION || '0.9.5-alpha') + ' carregado!');
        });

        document.addEventListener('sessao-carregada', function() {
            setTimeout(atualizarStatsAvancado, 300);
        });

        document.addEventListener('todas-sessoes-carregadas', function() {
            setTimeout(atualizarStatsAvancado, 500);
        });
    </script>
</body>
</html>
